name: Docker Publish

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: authcore-api
            image: ghcr.io/brunopsouz/authcore-api
            dockerfile: src/Backend/AuthCore/AuthCore.Api/Dockerfile
            context: src
          - name: notificationcore-api
            image: ghcr.io/brunopsouz/notificationcore-api
            dockerfile: src/Backend/NotificationCore/NotificationCore.Api/Dockerfile
            context: src
          - name: gateway-api
            image: ghcr.io/brunopsouz/gateway-api
            dockerfile: src/Backend/Gateway/Gateway.Api/Dockerfile
            context: src
          - name: authcore-web
            image: ghcr.io/brunopsouz/authcore-web
            dockerfile: src/Frontend/AuthCore.Web/Dockerfile
            context: src/Frontend/AuthCore.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  summary:
    name: Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: publish
    if: always()

    steps:
      - name: Write Docker publish summary
        run: |
          {
            echo "# Docker Publish Summary"
            echo ""
            echo "| Image | Registry | Dockerfile | Context |"
            echo "|---|---|---|---|"
            echo "| authcore-api | ghcr.io/brunopsouz/authcore-api | src/Backend/AuthCore/AuthCore.Api/Dockerfile | src |"
            echo "| notificationcore-api | ghcr.io/brunopsouz/notificationcore-api | src/Backend/NotificationCore/NotificationCore.Api/Dockerfile | src |"
            echo "| gateway-api | ghcr.io/brunopsouz/gateway-api | src/Backend/Gateway/Gateway.Api/Dockerfile | src |"
            echo "| authcore-web | ghcr.io/brunopsouz/authcore-web | src/Frontend/AuthCore.Web/Dockerfile | src/Frontend/AuthCore.Web |"
            echo ""
            echo "Deploy: not configured."
            echo "Environment: not configured."
          } >> "$GITHUB_STEP_SUMMARY"
