name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
      - feat/**
    paths:
      - "src/Backend/**"
      - "src/Shared/**"
      - "tests/**"
      - "AuthCore.sln"
      - "global.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "src/Backend/**"
      - "src/Shared/**"
      - "tests/**"
      - "AuthCore.sln"
      - "global.json"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET dependencies
        id: restore
        run: dotnet restore AuthCore.sln

      - name: Build backend solution
        id: build_backend
        run: dotnet build AuthCore.sln -c Release --no-restore

      - name: Run AuthCore domain unit tests
        id: test_authcore_domain
        run: dotnet test tests/AuthCore.Domain.UnitTests/AuthCore.Domain.UnitTests.csproj -c Release --no-build

      - name: Run AuthCore application unit tests
        id: test_authcore_application
        run: dotnet test tests/AuthCore.Application.UnitTests/AuthCore.Application.UnitTests.csproj -c Release --no-build

      - name: Run NotificationCore domain unit tests
        id: test_notificationcore_domain
        run: dotnet test tests/NotificationCore.Domain.UnitTests/NotificationCore.Domain.UnitTests.csproj -c Release --no-build

      - name: Run NotificationCore application unit tests
        id: test_notificationcore_application
        run: dotnet test tests/NotificationCore.Application.UnitTests/NotificationCore.Application.UnitTests.csproj -c Release --no-build

      - name: Publish AuthCore API artifact
        id: publish_authcore_api
        run: dotnet publish src/Backend/AuthCore/AuthCore.Api/AuthCore.Api.csproj -c Release -o artifacts/authcore-api --no-build

      - name: Publish NotificationCore API artifact
        id: publish_notificationcore_api
        run: dotnet publish src/Backend/NotificationCore/NotificationCore.Api/NotificationCore.Api.csproj -c Release -o artifacts/notificationcore-api --no-build

      - name: Publish Gateway API artifact
        id: publish_gateway_api
        run: dotnet publish src/Backend/Gateway/Gateway.Api/Gateway.Api.csproj -c Release -o artifacts/gateway-api --no-build

      - name: Upload AuthCore API artifact
        id: upload_authcore_api
        uses: actions/upload-artifact@v4
        with:
          name: authcore-api
          path: artifacts/authcore-api

      - name: Upload NotificationCore API artifact
        id: upload_notificationcore_api
        uses: actions/upload-artifact@v4
        with:
          name: notificationcore-api
          path: artifacts/notificationcore-api

      - name: Upload Gateway API artifact
        id: upload_gateway_api
        uses: actions/upload-artifact@v4
        with:
          name: gateway-api
          path: artifacts/gateway-api

      - name: Write backend build and unit test summary
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          {
            echo "# [CI] AuthCore Backend - Build"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Ambiente | \`ci\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Job | \`${{ github.job }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`$SHORT_SHA\` |"
            echo "| Solution | \`AuthCore.sln\` |"
            echo "| .NET SDK | \`10.0.x\` |"
            echo "| Configuration | \`Release\` |"
            echo "| Cache | \`~/.nuget/packages\` por \`*.csproj\` |"
            echo "| Restore | \`dotnet restore AuthCore.sln\` (\`${{ steps.restore.outcome }}\`) |"
            echo "| Build | \`dotnet build AuthCore.sln -c Release --no-restore\` (\`${{ steps.build_backend.outcome }}\`) |"
            echo "| Artifacts | \`authcore-api\`, \`notificationcore-api\`, \`gateway-api\` |"
            echo ""
            echo "## Checks"
            echo ""
            echo "- Restore de dependências .NET: \`${{ steps.restore.outcome }}\`"
            echo "- Build da solution: \`${{ steps.build_backend.outcome }}\`"
            echo "- Publish \`AuthCore.Api\`: \`${{ steps.publish_authcore_api.outcome }}\`"
            echo "- Publish \`NotificationCore.Api\`: \`${{ steps.publish_notificationcore_api.outcome }}\`"
            echo "- Publish \`Gateway.Api\`: \`${{ steps.publish_gateway_api.outcome }}\`"
            echo "- Upload de artifacts: AuthCore=\`${{ steps.upload_authcore_api.outcome }}\`, NotificationCore=\`${{ steps.upload_notificationcore_api.outcome }}\`, Gateway=\`${{ steps.upload_gateway_api.outcome }}\`"
            echo ""
            echo "# [CI] AuthCore Backend - Unit Tests"
            echo ""
            echo "| Test Project | Command | Status |"
            echo "|---|---|---|"
            echo "| \`AuthCore.Domain.UnitTests\` | \`dotnet test tests/AuthCore.Domain.UnitTests/AuthCore.Domain.UnitTests.csproj -c Release --no-build\` | \`${{ steps.test_authcore_domain.outcome }}\` |"
            echo "| \`AuthCore.Application.UnitTests\` | \`dotnet test tests/AuthCore.Application.UnitTests/AuthCore.Application.UnitTests.csproj -c Release --no-build\` | \`${{ steps.test_authcore_application.outcome }}\` |"
            echo "| \`NotificationCore.Domain.UnitTests\` | \`dotnet test tests/NotificationCore.Domain.UnitTests/NotificationCore.Domain.UnitTests.csproj -c Release --no-build\` | \`${{ steps.test_notificationcore_domain.outcome }}\` |"
            echo "| \`NotificationCore.Application.UnitTests\` | \`dotnet test tests/NotificationCore.Application.UnitTests/NotificationCore.Application.UnitTests.csproj -c Release --no-build\` | \`${{ steps.test_notificationcore_application.outcome }}\` |"
            echo ""
            echo "**Integração:** executada no job separado \`integration-tests\`."
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-and-unit-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AUTHCORE_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false
      NOTIFICATIONCORE_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false
      AUTHCORE_TEST_REDIS: localhost:6379,abortConnect=false
      ConnectionStrings__PostgreSql: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false
      Redis__ConnectionString: localhost:6379,abortConnect=false
      RabbitMq__Host: localhost
      RabbitMq__Port: 5672
      RabbitMq__VirtualHost: /
      RabbitMq__Username: guest
      RabbitMq__Password: guest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET dependencies
        id: restore
        run: dotnet restore AuthCore.sln

      - name: Build backend solution
        id: build_backend
        run: dotnet build AuthCore.sln -c Release --no-restore

      - name: Run AuthCore integration tests
        id: test_authcore_integration
        run: dotnet test tests/AuthCore.IntegrationTests/AuthCore.IntegrationTests.csproj -c Release --no-build

      - name: Run NotificationCore integration tests
        id: test_notificationcore_integration
        run: dotnet test tests/NotificationCore.IntegrationTests/NotificationCore.IntegrationTests.csproj -c Release --no-build

      - name: Run Gateway integration tests
        id: test_gateway_integration
        run: dotnet test tests/Gateway.IntegrationTests/Gateway.IntegrationTests.csproj -c Release --no-build

      - name: Write backend integration test summary
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          {
            echo "# [CI] AuthCore Backend - Integration Tests"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Ambiente | \`ci\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`$SHORT_SHA\` |"
            echo "| Services | \`PostgreSQL\`, \`Redis\`, \`RabbitMQ\` |"
            echo "| Restore | \`${{ steps.restore.outcome }}\` |"
            echo "| Build | \`${{ steps.build_backend.outcome }}\` |"
            echo "| Job Status | \`${{ job.status }}\` |"
            echo ""
            echo "| Integration Test Project | Command | Status |"
            echo "|---|---|---|"
            echo "| \`AuthCore.IntegrationTests\` | \`dotnet test tests/AuthCore.IntegrationTests/AuthCore.IntegrationTests.csproj -c Release --no-build\` | \`${{ steps.test_authcore_integration.outcome }}\` |"
            echo "| \`NotificationCore.IntegrationTests\` | \`dotnet test tests/NotificationCore.IntegrationTests/NotificationCore.IntegrationTests.csproj -c Release --no-build\` | \`${{ steps.test_notificationcore_integration.outcome }}\` |"
            echo "| \`Gateway.IntegrationTests\` | \`dotnet test tests/Gateway.IntegrationTests/Gateway.IntegrationTests.csproj -c Release --no-build\` | \`${{ steps.test_gateway_integration.outcome }}\` |"
            echo ""
            echo "## Infraestrutura do teste"
            echo ""
            echo "- PostgreSQL: \`postgres:16\`"
            echo "- Redis: \`redis:7\`"
            echo "- RabbitMQ: \`rabbitmq:3-management\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AuthCore API Docker image
        id: docker_build_authcore_api
        run: docker build -f src/Backend/AuthCore/AuthCore.Api/Dockerfile -t authcore-api-ci src

      - name: Build NotificationCore API Docker image
        id: docker_build_notificationcore_api
        run: docker build -f src/Backend/NotificationCore/NotificationCore.Api/Dockerfile -t notificationcore-api-ci src

      - name: Build Gateway API Docker image
        id: docker_build_gateway_api
        run: docker build -f src/Backend/Gateway/Gateway.Api/Dockerfile -t gateway-api-ci src

      - name: Write backend Docker build summary
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          {
            echo "# [CI] AuthCore Backend - Docker"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Ambiente | \`ci\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`$SHORT_SHA\` |"
            echo "| Contexto | \`src\` |"
            echo "| Publicação | \`disabled\` |"
            echo "| Deploy | \`not configured\` |"
            echo ""
            echo "| Image | Dockerfile | Context | Status |"
            echo "|---|---|---|---|"
            echo "| \`authcore-api-ci\` | \`src/Backend/AuthCore/AuthCore.Api/Dockerfile\` | \`src\` | \`${{ steps.docker_build_authcore_api.outcome }}\` |"
            echo "| \`notificationcore-api-ci\` | \`src/Backend/NotificationCore/NotificationCore.Api/Dockerfile\` | \`src\` | \`${{ steps.docker_build_notificationcore_api.outcome }}\` |"
            echo "| \`gateway-api-ci\` | \`src/Backend/Gateway/Gateway.Api/Dockerfile\` | \`src\` | \`${{ steps.docker_build_gateway_api.outcome }}\` |"
            echo ""
            echo "## Checks"
            echo ""
            echo "- Build local das imagens Docker de API."
            echo "- Registry publish: \`disabled\`."
            echo "- Deploy: \`not configured\`."
          } >> "$GITHUB_STEP_SUMMARY"
