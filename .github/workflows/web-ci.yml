name: Web CI

on:
  pull_request:
    branches:
      - develop
      - main
      - feat/**
    paths:
      - "src/Frontend/AuthCore.Web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "src/Frontend/AuthCore.Web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/Frontend/AuthCore.Web

    env:
      AUTHCORE_API_BASE_URL: http://localhost:5012
      AUTHCORE_SESSION_COOKIE_NAME: sid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: src/Frontend/AuthCore.Web/pnpm-lock.yaml

      - name: Install AuthCore.Web dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint AuthCore.Web
        id: lint
        run: pnpm lint

      - name: Write web lint summary
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          {
            echo "# [CI] AuthCore.Web - Qualidade"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Ambiente | \`ci\` |"
            echo "| Workflow | \`${{ github.workflow }}\` |"
            echo "| Job | \`${{ github.job }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`$SHORT_SHA\` |"
            echo "| Projeto | \`AuthCore.Web\` |"
            echo "| Diretório | \`src/Frontend/AuthCore.Web\` |"
            echo "| Node | \`22.x\` |"
            echo "| Package manager | \`pnpm 11.7.0\` |"
            echo "| Cache | \`pnpm-lock.yaml\` |"
            echo ""
            echo "## Checks"
            echo ""
            echo "- Instalação de dependências: \`pnpm install --frozen-lockfile\` (\`${{ steps.install.outcome }}\`)"
            echo "- ESLint: \`pnpm lint\` (\`${{ steps.lint.outcome }}\`)"
            echo ""
            echo "**Status:** \`${{ steps.lint.outcome }}\`"
            echo ""
            echo "_Job summary generated at run-time._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build AuthCore.Web
        id: build_web
        run: pnpm build

      - name: Upload Next.js build artifact
        id: upload_next_artifact
        uses: actions/upload-artifact@v4
        with:
          name: authcore-web-next-build
          path: src/Frontend/AuthCore.Web/.next

      - name: Write web build summary
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ -d ".next" ]; then
            NEXT_OUTPUT="yes"
          else
            NEXT_OUTPUT="no"
          fi

          {
            echo "# [CI] AuthCore.Web - Build"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Ambiente | \`ci\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`$SHORT_SHA\` |"
            echo "| Projeto | \`AuthCore.Web\` |"
            echo "| Framework | \`Next.js\` |"
            echo "| Node | \`22.x\` |"
            echo "| Package manager | \`pnpm 11.7.0\` |"
            echo "| Build | \`pnpm build\` |"
            echo "| Saída | \`.next\`: \`$NEXT_OUTPUT\` |"
            echo "| Artifact | \`authcore-web-next-build\` (\`${{ steps.upload_next_artifact.outcome }}\`) |"
            echo "| Docker | job separado: \`docker-build\` |"
            echo "| Deploy | \`not configured\` |"
            echo "| Registry publish | \`disabled\` |"
            echo ""
            echo "## Checks"
            echo ""
            echo "- Build Next.js SSR/Node: \`pnpm build\` (\`${{ steps.build_web.outcome }}\`)"
            echo "- Upload do artifact \`.next\`: \`${{ steps.upload_next_artifact.outcome }}\`"
            echo "- Imagem local prevista: \`authcore-web-ci\`"
            echo ""
            echo "**Status:** \`${{ steps.build_web.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AuthCore.Web Docker image
        id: docker_build_web
        run: docker build -t authcore-web-ci src/Frontend/AuthCore.Web

      - name: Write web Docker build summary
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          {
            echo "# [CI] AuthCore.Web - Docker"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Ambiente | \`ci\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`$SHORT_SHA\` |"
            echo "| Projeto | \`AuthCore.Web\` |"
            echo "| Imagem | \`authcore-web-ci\` |"
            echo "| Dockerfile | \`src/Frontend/AuthCore.Web/Dockerfile\` |"
            echo "| Contexto | \`src/Frontend/AuthCore.Web\` |"
            echo "| Publicação | \`disabled\` |"
            echo "| Deploy | \`not configured\` |"
            echo ""
            echo "## Checks"
            echo ""
            echo "- Docker build local de validação: \`docker build -t authcore-web-ci src/Frontend/AuthCore.Web\`"
            echo "- Registry publish: \`disabled\`"
            echo "- Deploy: \`not configured\`"
            echo ""
            echo "**Status:** \`${{ steps.docker_build_web.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
