name: Web CI

on:
  pull_request:
    branches:
      - develop
      - main
      - feat/**
    paths:
      - "src/Frontend/AuthCore.Web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "src/Frontend/AuthCore.Web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/Frontend/AuthCore.Web

    env:
      AUTHCORE_API_BASE_URL: http://localhost:5012
      AUTHCORE_SESSION_COOKIE_NAME: sid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: src/Frontend/AuthCore.Web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: authcore-web-next-build
          path: src/Frontend/AuthCore.Web/.next

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AuthCore Web image
        run: docker build -t authcore-web-ci src/Frontend/AuthCore.Web
