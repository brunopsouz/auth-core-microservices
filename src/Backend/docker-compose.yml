services:
  authcore-api:
    build:
      context: ..
      dockerfile: Backend/AuthCore/AuthCore.Api/Dockerfile
    ports:
      - "127.0.0.1:${AUTHCORE_API_PORT:?AUTHCORE_API_PORT is required}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?ASPNETCORE_ENVIRONMENT is required}
      ASPNETCORE_HTTP_PORTS: 8080
      CONNECTIONSTRINGS__POSTGRESQL: Host=authcore-postgres;Port=5432;Database=${AUTHCORE_POSTGRES_DB:?AUTHCORE_POSTGRES_DB is required};Username=${AUTHCORE_POSTGRES_USER:?AUTHCORE_POSTGRES_USER is required};Password=${AUTHCORE_POSTGRES_PASSWORD:?AUTHCORE_POSTGRES_PASSWORD is required};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=30;Timeout=10;Command Timeout=30;Application Name=AuthCore
      DATABASE__MIGRATIONS__AUTOMIGRATEONSTARTUP: ${AUTHCORE_DATABASE_MIGRATIONS_AUTOMIGRATEONSTARTUP:?AUTHCORE_DATABASE_MIGRATIONS_AUTOMIGRATEONSTARTUP is required}
      DATABASE__MIGRATIONS__ENSUREDATABASECREATED: ${AUTHCORE_DATABASE_MIGRATIONS_ENSUREDATABASECREATED:?AUTHCORE_DATABASE_MIGRATIONS_ENSUREDATABASECREATED is required}
      DATABASE__MIGRATIONS__ADMINDATABASE: postgres
      REDIS__CONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required},abortConnect=false
      REDIS__KEYPREFIX: ${REDIS__KEYPREFIX:?REDIS__KEYPREFIX is required}
      DATAPROTECTION__APPLICATIONNAME: ${DATAPROTECTION__APPLICATIONNAME:-AuthCore}
      DATAPROTECTION__KEYNAME: ${DATAPROTECTION__KEYNAME:-data-protection-keys}
      DATAPROTECTION__REQUIRECERTIFICATE: ${DATAPROTECTION__REQUIRECERTIFICATE:-false}
      DATAPROTECTION__CERTIFICATEPATH: ${DATAPROTECTION__CERTIFICATEPATH:-}
      DATAPROTECTION__CERTIFICATEPASSWORD: ${DATAPROTECTION__CERTIFICATEPASSWORD:-}
      REVERSEPROXY__KNOWNNETWORKS__0: ${REVERSEPROXY__KNOWNNETWORKS__0:-172.28.0.0/16}
      REVERSEPROXY__FORWARDLIMIT: ${REVERSEPROXY__FORWARDLIMIT:-2}
      AUTHENTICATION__JWT__ISSUER: ${AUTHENTICATION__JWT__ISSUER:?AUTHENTICATION__JWT__ISSUER is required}
      AUTHENTICATION__JWT__AUDIENCE: ${AUTHENTICATION__JWT__AUDIENCE:?AUTHENTICATION__JWT__AUDIENCE is required}
      AUTHENTICATION__JWT__SIGNINGKEY: ${AUTHENTICATION__JWT__SIGNINGKEY:?AUTHENTICATION__JWT__SIGNINGKEY is required}
      AUTHENTICATION__JWT__ACCESSTOKENLIFETIMEMINUTES: ${AUTHENTICATION__JWT__ACCESSTOKENLIFETIMEMINUTES:?AUTHENTICATION__JWT__ACCESSTOKENLIFETIMEMINUTES is required}
      AUTHENTICATION__JWT__REFRESHTOKENLIFETIMEDAYS: ${AUTHENTICATION__JWT__REFRESHTOKENLIFETIMEDAYS:?AUTHENTICATION__JWT__REFRESHTOKENLIFETIMEDAYS is required}
      AUTHENTICATION__JWT__CLOCKSKEWSECONDS: ${AUTHENTICATION__JWT__CLOCKSKEWSECONDS:?AUTHENTICATION__JWT__CLOCKSKEWSECONDS is required}
      AUTHENTICATION__GOOGLE__CLIENTID: ${AUTHENTICATION__GOOGLE__CLIENTID:-}
      AUTHENTICATION__GOOGLE__CLIENTSECRET: ${AUTHENTICATION__GOOGLE__CLIENTSECRET:-}
      AUTHENTICATION__GOOGLE__CALLBACKPATH: ${AUTHENTICATION__GOOGLE__CALLBACKPATH:-/api/auth/external/google/callback}
      AUTHENTICATION__DEFAULTRETURNURL: ${AUTHENTICATION__DEFAULTRETURNURL:?AUTHENTICATION__DEFAULTRETURNURL is required}
      AUTHENTICATION__ALLOWEDRETURNURLS__0: ${AUTHENTICATION__ALLOWEDRETURNURLS__0:-}
      AUTHENTICATION__ALLOWEDRETURNURLS__1: ${AUTHENTICATION__ALLOWEDRETURNURLS__1:-}
      AUTHENTICATION__ALLOWEDRETURNURLS__2: ${AUTHENTICATION__ALLOWEDRETURNURLS__2:-}
      AUTHENTICATION__ALLOWEDRETURNURLS__3: ${AUTHENTICATION__ALLOWEDRETURNURLS__3:-}
      RABBITMQ__HOST: rabbitmq
      RABBITMQ__PORT: 5672
      RABBITMQ__VIRTUALHOST: /
      RABBITMQ__USERNAME: ${RABBITMQ__USERNAME:?RABBITMQ__USERNAME is required}
      RABBITMQ__PASSWORD: ${RABBITMQ__PASSWORD:?RABBITMQ__PASSWORD is required}
      RABBITMQ__EXCHANGE: ${RABBITMQ__EXCHANGE:?RABBITMQ__EXCHANGE is required}
      RABBITMQ__ROUTINGKEY: ${RABBITMQ__ROUTINGKEY:?RABBITMQ__ROUTINGKEY is required}
      RABBITMQ__QUEUE: ${RABBITMQ__QUEUE:?RABBITMQ__QUEUE is required}
      RABBITMQ__DEADLETTERQUEUE: ${RABBITMQ__DEADLETTERQUEUE:?RABBITMQ__DEADLETTERQUEUE is required}
      OUTBOX__ENABLED: ${OUTBOX__ENABLED:?OUTBOX__ENABLED is required}
      OUTBOX__BATCHSIZE: ${OUTBOX__BATCHSIZE:?OUTBOX__BATCHSIZE is required}
      OUTBOX__POLLINGINTERVALSECONDS: ${OUTBOX__POLLINGINTERVALSECONDS:?OUTBOX__POLLINGINTERVALSECONDS is required}
      OUTBOX__MAXATTEMPTS: ${OUTBOX__MAXATTEMPTS:?OUTBOX__MAXATTEMPTS is required}
      AUTH__COOKIE__SESSIONCOOKIENAME: ${AUTH__COOKIE__SESSIONCOOKIENAME:?AUTH__COOKIE__SESSIONCOOKIENAME is required}
      AUTH__COOKIE__ACCESSTOKENCOOKIENAME: ${AUTH__COOKIE__ACCESSTOKENCOOKIENAME:?AUTH__COOKIE__ACCESSTOKENCOOKIENAME is required}
      AUTH__COOKIE__SECURE: false
      AUTH__CSRF__SIGNINGKEY: ${AUTH__CSRF__SIGNINGKEY:?AUTH__CSRF__SIGNINGKEY is required}
      AUTH__CSRF__ALLOWEDORIGINS__0: ${AUTH__CSRF__ALLOWEDORIGINS__0:-}
      AUTH__CSRF__ALLOWEDORIGINS__1: ${AUTH__CSRF__ALLOWEDORIGINS__1:-}
      AUTH__CSRF__ALLOWEDORIGINS__2: ${AUTH__CSRF__ALLOWEDORIGINS__2:-}
      AUTH__CSRF__ALLOWEDORIGINS__3: ${AUTH__CSRF__ALLOWEDORIGINS__3:-}
      OBSERVABILITY__OTLPENABLED: ${OBSERVABILITY__OTLPENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
    depends_on:
      authcore-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - notificationcore-local
    restart: unless-stopped

  notificationcore-api:
    build:
      context: ..
      dockerfile: Backend/NotificationCore/NotificationCore.Api/Dockerfile
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?ASPNETCORE_ENVIRONMENT is required}
      ASPNETCORE_HTTP_PORTS: 8080
      CONNECTIONSTRINGS__POSTGRESQL: Host=notificationcore-postgres;Port=5432;Database=${NOTIFICATIONCORE_POSTGRES_DB:?NOTIFICATIONCORE_POSTGRES_DB is required};Username=${NOTIFICATIONCORE_POSTGRES_USER:?NOTIFICATIONCORE_POSTGRES_USER is required};Password=${NOTIFICATIONCORE_POSTGRES_PASSWORD:?NOTIFICATIONCORE_POSTGRES_PASSWORD is required};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=30;Timeout=10;Command Timeout=30;Application Name=NotificationCore
      DATABASE__MIGRATIONS__AUTOMIGRATEONSTARTUP: ${NOTIFICATIONCORE_DATABASE_MIGRATIONS_AUTOMIGRATEONSTARTUP:?NOTIFICATIONCORE_DATABASE_MIGRATIONS_AUTOMIGRATEONSTARTUP is required}
      DATABASE__MIGRATIONS__ENSUREDATABASECREATED: ${NOTIFICATIONCORE_DATABASE_MIGRATIONS_ENSUREDATABASECREATED:?NOTIFICATIONCORE_DATABASE_MIGRATIONS_ENSUREDATABASECREATED is required}
      DATABASE__MIGRATIONS__ADMINDATABASE: postgres
      RABBITMQ__ENABLED: ${NOTIFICATIONCORE_RABBITMQ_CONSUMER_ENABLED:?NOTIFICATIONCORE_RABBITMQ_CONSUMER_ENABLED is required}
      RABBITMQ__HOST: rabbitmq
      RABBITMQ__PORT: 5672
      RABBITMQ__VIRTUALHOST: /
      RABBITMQ__USERNAME: ${RABBITMQ__USERNAME:?RABBITMQ__USERNAME is required}
      RABBITMQ__PASSWORD: ${RABBITMQ__PASSWORD:?RABBITMQ__PASSWORD is required}
      RABBITMQ__EXCHANGE: ${RABBITMQ__EXCHANGE:?RABBITMQ__EXCHANGE is required}
      RABBITMQ__ROUTINGKEY: ${RABBITMQ__ROUTINGKEY:?RABBITMQ__ROUTINGKEY is required}
      RABBITMQ__QUEUE: ${RABBITMQ__QUEUE:?RABBITMQ__QUEUE is required}
      RABBITMQ__DEADLETTERQUEUE: ${RABBITMQ__DEADLETTERQUEUE:?RABBITMQ__DEADLETTERQUEUE is required}
      SMTP__HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP__PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP__USERNAME: ${SMTP_USERNAME:-}
      SMTP__PASSWORD: ${SMTP_PASSWORD:-}
      SMTP__USETLS: ${SMTP_USE_TLS:?SMTP_USE_TLS is required}
      SMTP__SENDEREMAIL: ${SMTP_SENDER_EMAIL:?SMTP_SENDER_EMAIL is required}
      SMTP__SENDERNAME: ${SMTP_SENDER_NAME:?SMTP_SENDER_NAME is required}
      SMTP__TIMEOUTSECONDS: ${SMTP_TIMEOUT_SECONDS:?SMTP_TIMEOUT_SECONDS is required}
      NOTIFICATIONDISPATCHER__ENABLED: ${NOTIFICATIONCORE_DISPATCHER_ENABLED:?NOTIFICATIONCORE_DISPATCHER_ENABLED is required}
      NOTIFICATIONDISPATCHER__BATCHSIZE: ${NOTIFICATIONCORE_DISPATCHER_BATCH_SIZE:?NOTIFICATIONCORE_DISPATCHER_BATCH_SIZE is required}
      NOTIFICATIONDISPATCHER__POLLINGINTERVALSECONDS: ${NOTIFICATIONCORE_DISPATCHER_POLLING_INTERVAL_SECONDS:?NOTIFICATIONCORE_DISPATCHER_POLLING_INTERVAL_SECONDS is required}
      NOTIFICATIONDISPATCHER__RETRYDELAYSECONDS: ${NOTIFICATIONCORE_DISPATCHER_RETRY_DELAY_SECONDS:?NOTIFICATIONCORE_DISPATCHER_RETRY_DELAY_SECONDS is required}
      NOTIFICATIONDISPATCHER__PROCESSINGTIMEOUTSECONDS: ${NOTIFICATIONCORE_DISPATCHER_PROCESSING_TIMEOUT_SECONDS:?NOTIFICATIONCORE_DISPATCHER_PROCESSING_TIMEOUT_SECONDS is required}
      OBSERVABILITY__OTLPENABLED: ${OBSERVABILITY__OTLPENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
    depends_on:
      notificationcore-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - notificationcore-local
    restart: unless-stopped

  gateway-api:
    build:
      context: ..
      dockerfile: Backend/Gateway/Gateway.Api/Dockerfile
    ports:
      - "127.0.0.1:${GATEWAY_API_PORT:?GATEWAY_API_PORT is required}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?ASPNETCORE_ENVIRONMENT is required}
      ASPNETCORE_HTTP_PORTS: 8080
      AUTHENTICATION__JWT__ISSUER: ${AUTHENTICATION__JWT__ISSUER:?AUTHENTICATION__JWT__ISSUER is required}
      AUTHENTICATION__JWT__AUDIENCE: ${AUTHENTICATION__JWT__AUDIENCE:?AUTHENTICATION__JWT__AUDIENCE is required}
      AUTHENTICATION__JWT__SIGNINGKEY: ${AUTHENTICATION__JWT__SIGNINGKEY:?AUTHENTICATION__JWT__SIGNINGKEY is required}
      AUTHENTICATION__JWT__CLOCKSKEWSECONDS: ${AUTHENTICATION__JWT__CLOCKSKEWSECONDS:?AUTHENTICATION__JWT__CLOCKSKEWSECONDS is required}
      AUTHENTICATION__JWT__REQUIREHTTPSMETADATA: false
      AUTH__COOKIE__SESSIONCOOKIENAME: ${AUTH__COOKIE__SESSIONCOOKIENAME:?AUTH__COOKIE__SESSIONCOOKIENAME is required}
      AUTH__COOKIE__ACCESSTOKENCOOKIENAME: ${AUTH__COOKIE__ACCESSTOKENCOOKIENAME:?AUTH__COOKIE__ACCESSTOKENCOOKIENAME is required}
      AUTH__CSRF__SIGNINGKEY: ${AUTH__CSRF__SIGNINGKEY:?AUTH__CSRF__SIGNINGKEY is required}
      AUTH__CSRF__ALLOWEDORIGINS__0: ${AUTH__CSRF__ALLOWEDORIGINS__0:-}
      AUTH__CSRF__ALLOWEDORIGINS__1: ${AUTH__CSRF__ALLOWEDORIGINS__1:-}
      AUTH__CSRF__ALLOWEDORIGINS__2: ${AUTH__CSRF__ALLOWEDORIGINS__2:-}
      AUTH__CSRF__ALLOWEDORIGINS__3: ${AUTH__CSRF__ALLOWEDORIGINS__3:-}
      REVERSEPROXY__KNOWNNETWORKS__0: ${REVERSEPROXY__KNOWNNETWORKS__0:-172.28.0.0/16}
      REVERSEPROXY__FORWARDLIMIT: ${REVERSEPROXY__FORWARDLIMIT:-2}
      OBSERVABILITY__OTLPENABLED: ${OBSERVABILITY__OTLPENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
    depends_on:
      authcore-api:
        condition: service_started
      notificationcore-api:
        condition: service_started
    networks:
      - notificationcore-local
    restart: unless-stopped

  authcore-postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${AUTHCORE_POSTGRES_PORT:?AUTHCORE_POSTGRES_PORT is required}:5432"
    environment:
      POSTGRES_DB: ${AUTHCORE_POSTGRES_DB:?AUTHCORE_POSTGRES_DB is required}
      POSTGRES_USER: ${AUTHCORE_POSTGRES_USER:?AUTHCORE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${AUTHCORE_POSTGRES_PASSWORD:?AUTHCORE_POSTGRES_PASSWORD is required}
    volumes:
      - authcore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${AUTHCORE_POSTGRES_USER:?AUTHCORE_POSTGRES_USER is required} -d ${AUTHCORE_POSTGRES_DB:?AUTHCORE_POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notificationcore-local
    restart: unless-stopped

  notificationcore-postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${NOTIFICATIONCORE_POSTGRES_PORT:?NOTIFICATIONCORE_POSTGRES_PORT is required}:5432"
    environment:
      POSTGRES_DB: ${NOTIFICATIONCORE_POSTGRES_DB:?NOTIFICATIONCORE_POSTGRES_DB is required}
      POSTGRES_USER: ${NOTIFICATIONCORE_POSTGRES_USER:?NOTIFICATIONCORE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${NOTIFICATIONCORE_POSTGRES_PASSWORD:?NOTIFICATIONCORE_POSTGRES_PASSWORD is required}
    volumes:
      - notificationcore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${NOTIFICATIONCORE_POSTGRES_USER:?NOTIFICATIONCORE_POSTGRES_USER is required} -d ${NOTIFICATIONCORE_POSTGRES_DB:?NOTIFICATIONCORE_POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notificationcore-local
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT is required}:6379"
    command: redis-server --port 6379 --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - notificationcore-local
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__USERNAME:?RABBITMQ__USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__PASSWORD:?RABBITMQ__PASSWORD is required}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:?RABBITMQ_PORT is required}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:?RABBITMQ_MANAGEMENT_PORT is required}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - notificationcore-local
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: authcore-otel-collector
    profiles:
      - observability
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_COLLECTOR_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_COLLECTOR_PROMETHEUS_PORT:-8889}:8889"
      - "127.0.0.1:${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./observability/otel-collector/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - notificationcore-local
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.19.0}
    container_name: authcore-jaeger
    profiles:
      - observability
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    expose:
      - "4317"
      - "13133"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13133/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - notificationcore-local
    restart: unless-stopped

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.5.7}
    container_name: authcore-loki
    profiles:
      - observability
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    ports:
      - "127.0.0.1:${LOKI_HTTP_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - notificationcore-local
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: authcore-prometheus
    profiles:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - otel-collector
    networks:
      - notificationcore-local
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: authcore-grafana
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - notificationcore-local
    restart: unless-stopped

volumes:
  authcore-postgres-data:
  notificationcore-postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  notificationcore-local:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
